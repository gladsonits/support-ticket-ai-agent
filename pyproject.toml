[project]
name = "fastapi-tutorial"
version = "0.1.0"
description = "Backend API for support ticket smart AI agent."
readme = "README.md"
authors = [
    { name = "gladsonits", email = "gladson.bits@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "detoxify>=0.5.4",
    "emoji>=2.16.0",
    "fastapi[standard]>=0.142.2",
    "langchain-core>=1.6.11",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.15",
    "ollama>=0.6.3",
    "pandas>=3.0.6",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "psycopg2>=2.9.13",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.1.4",
    "torch>=2.14.1",
    "transformers>=5.20.0",
]

[project.scripts]
fastapi-tutorial = "fastapi_tutorial:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
